<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolphin Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: sticky top bar, summary tiles, attention panel beside category breakdown, then a dense operable item table. */
  --bg:#f3f5f9; --surface:#ffffff; --ink:#18212f; --muted:#667085; --line:#e3e8ef; --accent:#0b3d91; --accent-soft:#e6edf9;
  --red:#c42b2b; --red-soft:#fdecec; --amber:#b26a00; --amber-soft:#fff4e0; --green:#18794e; --green-soft:#e6f5ec; --grey-soft:#f0f2f6;
  --display:"Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif; --brand:#0a2e6e; --brand-2:#1764d8; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131c; --surface:#161d29; --ink:#e6ebf3; --muted:#93a0b4; --line:#263042; --accent:#5b93f5; --accent-soft:#1a2a47;
  --red:#f07171; --red-soft:#3a1c1f; --amber:#f0b04a; --amber-soft:#3a2b12; --green:#4cc38a; --green-soft:#12301f; --grey-soft:#1d2533;
  --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e131c; --surface:#161d29; --ink:#e6ebf3; --muted:#93a0b4; --line:#263042; --accent:#5b93f5; --accent-soft:#1a2a47;
  --red:#f07171; --red-soft:#3a1c1f; --amber:#f0b04a; --amber-soft:#3a2b12; --green:#4cc38a; --green-soft:#12301f; --grey-soft:#1d2533;
  --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 48px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--brand);border-bottom:3px solid var(--brand-2);color:#fff}
.top .brand small,.top .brand small *{color:rgba(255,255,255,.72)}
.top .logo{background:#fff;color:var(--brand)}
.top .tab{color:rgba(255,255,255,.78)}
.top .tab:hover{color:#fff;background:rgba(255,255,255,.12)}
.top .tab.on{color:#fff;background:rgba(255,255,255,.18)}
.top .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:#fff}
.top .btn:hover{background:rgba(255,255,255,.16);border-color:#fff;color:#fff}
.top .btn.primary{background:#fff;border-color:#fff;color:var(--brand);font-weight:700}
.top .btn.primary:hover{filter:none;background:#eaf1ff;color:var(--brand)}
.top .gsearch input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
.top .gsearch input::placeholder{color:rgba(255,255,255,.65)}
.top .gsearch svg{color:rgba(255,255,255,.7)}
.top .bell .badge{border:2px solid var(--brand)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand h1{font:800 18px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn svg{width:16px;height:16px}
.bell{position:relative;padding:8px 10px}
.bell .badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}

/* banner */
.banner{margin-top:18px;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);color:var(--ink)}
.banner b{color:var(--amber)}
.banner .btn{margin-left:auto}
.banner.good{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.banner.good b{color:var(--green)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;cursor:default}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--accent)}
.tile .k{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font:800 26px/1.15 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.tile.warn .v{color:var(--amber)} .tile.crit .v{color:var(--red)}
.tile .meter{height:6px;border-radius:3px;background:var(--grey-soft);margin-top:8px;overflow:hidden;display:flex}
.tile .meter i{display:block;height:100%}

/* two panel row */
.row2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel h2{font:700 15px/1.2 var(--display);margin:0}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph .sub{color:var(--muted);font-size:12.5px;margin-left:auto}
.alist{max-height:420px;overflow:auto}
.aitem{display:grid;grid-template-columns:1fr 150px 92px;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.aitem:last-child{border-bottom:0}
.aitem .nm{font-weight:600}
.aitem .cat{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--grey-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.aitem .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.need{font-size:12.5px;text-align:right;font-weight:600}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.cats{padding:8px 16px 14px}
.crow{display:grid;grid-template-columns:150px 1fr 92px;gap:10px;align-items:center;padding:7px 0;cursor:pointer;border-radius:6px}
.crow:hover .cn{color:var(--accent)}
.crow .cn{font-weight:500;font-size:13px}
.crow .cv{text-align:right;font-size:13px;color:var(--muted)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--grey-soft)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 16px 14px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* table */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .c{opacity:.65;margin-left:4px}
select.sel{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--surface)}
.bulk{display:none;align-items:center;gap:10px;padding:10px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bulk.on{display:flex}
.bulk input{width:70px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;white-space:nowrap;user-select:none}
th.sort{cursor:pointer}th.sort:hover{color:var(--ink)}
th .ar{opacity:.5;margin-left:3px}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
tr.sel td{background:var(--accent-soft)}
.r{text-align:right}
td.item .n{font-weight:600}
td.item .c{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:20px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-out{background:var(--red-soft);color:var(--red)}
.p-low{background:var(--amber-soft);color:var(--amber)}
.p-ok{background:var(--green-soft);color:var(--green)}
.p-idle,.p-none{background:var(--grey-soft);color:var(--muted)}
.stock{display:flex;align-items:center;gap:8px;min-width:130px}
.stock .bar{flex:1;height:6px}
.stock b{min-width:44px;text-align:right;font-weight:600}
.minbox{display:flex;align-items:center;gap:6px}
.minbox input{width:62px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:right}
.minbox input:placeholder-shown{border-style:dashed}
.star{background:none;border:0;cursor:pointer;padding:2px;color:var(--muted);line-height:0}
.star.on{color:var(--accent)}
.star svg{width:18px;height:18px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.foot{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}

/* drawer + toast + modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.35);display:none;z-index:40}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .ph{padding:16px}
.drawer .body{overflow:auto;flex:1}
.note{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.note .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.note .t{font-weight:600}
.note .d{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:10px;z-index:60;transition:.2s;font-size:13.5px;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:55;padding:16px}
.modal.on{display:grid}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(460px,100%);padding:20px}
.mbox h3{font:700 16px var(--display);margin:0 0 6px}
.mbox p{color:var(--muted);margin:0 0 14px;font-size:13.5px}
.mbox label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mbox input[type=number]{width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px}
.syncdot.ok{background:var(--green)}

@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,1fr)}.row2{grid-template-columns:1fr}}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}.aitem{grid-template-columns:1fr 90px}.aitem .need{grid-column:1/-1;text-align:left}.crow{grid-template-columns:110px 1fr 70px}.top .btn span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v2 additions */
.top .wrap{gap:12px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{padding:8px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.tab:hover{color:var(--ink);background:var(--grey-soft)}
.tab.on{color:var(--accent);background:var(--accent-soft)}
.gsearch{position:relative;width:240px}
.gsearch input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.gsearch svg{position:absolute;left:9px;top:9px;width:16px;height:16px;color:var(--muted)}
a{color:var(--accent)}
.mut{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}
h1{font:800 24px/1.2 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:18px 0 14px;flex-wrap:wrap}
.headact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumbs{display:flex;gap:8px;align-items:center;margin-top:18px;font-size:13px;color:var(--muted)}
.crumbs a{text-decoration:none}
.tiles.t3{grid-template-columns:repeat(3,1fr)} .tiles.t4{grid-template-columns:repeat(4,1fr)}
.tiles{margin-top:16px}
.aitem{text-decoration:none;color:inherit}
.aitem:hover{background:var(--grey-soft)}
.checks{padding:10px 16px 14px;display:grid;gap:8px}
.chk{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
.chk b{font:800 20px var(--display);min-width:36px}
.chk.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 25%,transparent);cursor:pointer}
.chk.warn b{color:var(--amber)} .chk.ok b{color:var(--green)}
.chk em{margin-left:auto;font-style:normal;color:var(--accent);font-weight:600;font-size:13px}
table.grid{min-width:760px}
.rowlink{cursor:pointer}
td.item a.n{font-weight:600;color:var(--ink);text-decoration:none}
td.item a.n:hover{color:var(--accent)}
a.po{font-family:var(--mono);font-size:12.5px;font-weight:500}
.p-asg{background:var(--accent-soft);color:var(--accent)}
.p-po-open{background:var(--grey-soft);color:var(--muted)} .p-po-partial{background:var(--amber-soft);color:var(--amber)} .p-po-received{background:var(--green-soft);color:var(--green)}
.flag{display:inline-block;font-size:11px;font-weight:600;color:var(--red);background:var(--red-soft);border-radius:5px;padding:1px 6px;margin-left:4px}
.acts{display:flex;gap:6px;justify-content:flex-end}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.warnc{color:var(--amber);font-weight:600}
.minlabel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.minlabel input,.mi{width:64px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:right}
.mi:placeholder-shown{border-style:dashed}
.seg{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.flow{display:flex;align-items:center;gap:10px;margin:0 0 16px;flex-wrap:wrap}
.flow .step{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.flow .step b{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
.flow .step span{font-weight:600;font-size:13.5px}
.flow .step small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.flow i{flex:0 0 22px;height:2px;background:var(--line)}
.feed .fi{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.feed .fi:hover{background:var(--grey-soft)}
.fb{flex:1;min-width:0}
.fw{text-align:right;font-size:12.5px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px;background:var(--muted)}
.d-received{background:var(--green)} .d-assigned{background:var(--accent)} .d-reassigned{background:#7c5cd6} .d-released{background:var(--amber)} .d-serial{background:var(--muted)}
/* unit drawer */
.udrawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.udrawer.on{transform:none}
.udrawer .body{overflow:auto;flex:1;padding:4px 20px 24px}
.uhead{display:grid;gap:8px;padding:6px 0 14px;border-bottom:1px solid var(--line)}
.userial{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px;word-break:break-all}
.uhead .pill{justify-self:start}
.iconbtn{background:none;border:1px solid var(--line);border-radius:7px;cursor:pointer;padding:4px 6px;line-height:0;color:var(--muted)}
.iconbtn svg{width:15px;height:15px}
.facts{display:grid;gap:10px;margin:14px 0}
.facts div{display:grid;grid-template-columns:120px 1fr;gap:10px}
.facts dt{color:var(--muted);font-size:13px} .facts dd{margin:0}
.uacts{display:flex;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.tlh{font:700 14px var(--display);margin:16px 0 8px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:flex;gap:12px;padding:0 0 16px;position:relative}
.tl li::before{content:"";position:absolute;left:4px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.note2{margin-top:4px;font-size:13px;background:var(--grey-soft);border-radius:7px;padding:5px 8px}
/* modal form */
.mbox{width:min(520px,100%);max-height:90vh;overflow:auto}
.mbox.wide{width:min(760px,100%)}
.fld{display:grid;gap:5px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plhead,.pline{display:grid;grid-template-columns:1fr 80px 110px 32px;gap:8px;align-items:center}
.plhead{font-size:12px;color:var(--muted)}
.pline{margin-bottom:6px}
.pline input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.rline{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.rrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px}
.rrow input.rq{width:70px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);margin-left:6px}
.chk2{display:flex;gap:6px;align-items:center}
.serials{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin-top:10px}
.serials input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.d-po-created{background:var(--accent)} .d-po-edited{background:#7c5cd6} .d-po-received{background:var(--green)} .d-min{background:var(--muted)} .d-item-created{background:var(--accent)}
.asme{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.av{width:18px;height:18px;border-radius:50%;flex:none}
.tlwrap{padding:14px 16px 4px}
.mechip span{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.setup[hidden]{display:none}
.setup.demo{align-items:flex-start;background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.dsteps{margin:10px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 16px;counter-reset:s}
.dsteps li{counter-increment:s;display:grid;grid-template-columns:22px 1fr;column-gap:8px;font-size:13.5px}
.dsteps li::before{content:counter(s);grid-row:span 2;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--green);color:var(--green);display:grid;place-items:center;font-size:11px;font-weight:700}
.dsteps li.ok::before{content:"✓";background:var(--green);color:#fff}
.dsteps li.ok a{text-decoration:line-through;color:var(--muted)}
.dsteps small{color:var(--muted);font-size:12px}
.setup{margin-top:16px;display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);flex-wrap:wrap}
.setup>div:first-child{flex:1 1 380px}
.prog{flex-basis:100%;height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
a.note{text-decoration:none;color:inherit}
a.note:hover{background:var(--grey-soft)}
.foot .mut{font-size:12px}
@media (max-width:900px){.gsearch{width:100%;order:9}.tiles.t4{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:560px){.tiles.t3{grid-template-columns:1fr 1fr}.facts div{grid-template-columns:1fr}}
</style>

<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#inventory" style="text-decoration:none;color:inherit;margin-right:8px">
      <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></div>
      <div><h1 style="font-size:17px">Dolphin Inventory</h1><small><span class="syncdot" id="syncdot"></span><span id="sync"></span></small></div>
    </a>
    <nav class="tabs" id="nav" aria-label="Sections"></nav>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div class="gsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="search" type="search" placeholder="Find serial, PO or merchant" aria-label="Find serial, PO or merchant"></div>
      <button class="btn primary" id="bRestock" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>Restock PDF</span></button>
      <button class="btn" id="bPdf" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span>Full report</span></button>
      <button class="btn bell" id="bBell" type="button" aria-label="Low stock notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="badge" id="badge" hidden>0</span></button>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="setup" id="setup" hidden></div>
  <div id="view"></div>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Low stock notifications">
  <div class="ph"><h2>Low stock</h2><button class="btn" id="dClose" type="button" style="margin-left:auto">Close</button></div>
  <div class="body" id="dBody"></div>
</aside>
<aside class="udrawer" id="unitDrawer" aria-label="Unit details">
  <div class="ph" style="border-bottom:0"><h2>Unit</h2><button class="btn" id="uClose" type="button" style="margin-left:auto">Close</button></div>
  <div class="body" id="uBody"></div>
</aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <form class="mbox" id="mForm" novalidate>
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
    <div class="mact"><button class="btn" id="mCancel" type="button">Cancel</button><button class="btn primary" id="mSubmit" type="submit">Save</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
/* Shared core: categories, status logic, PDF report builder. Used by the page and by the Node test. */
var INV = (function () {
  var CATS = [
    ["POS Systems", /clover station/i],
    ["Services & Fees", /fee|service|firmware|injection|programming|license|cloud storage|transfirst|test item/i],
    ["Supplies & Accessories", /paper|drawer|decal|router|dock/i],
    ["Printers", /printer|tm[- ]?t|tmu|tsp|mc[- ]?print|xp-t80/i],
    ["Scanners & Scales", /scanner|datalogic|symbol|gryphon|scale|cas sw/i],
    ["ATMs & Parts", /atm|genmega|hyosung|hyusong|hantle|halo|double detect/i],
    ["POS Systems", /pos machine|psj|elo|clover station|ipad|han-|hanasis|pc america pos/i],
    ["Payment Terminals", /pax|dejavoo|clover|eport|elys/i]
  ];
  var CAT_ORDER = ["Payment Terminals", "POS Systems", "ATMs & Parts", "Printers", "Scanners & Scales", "Supplies & Accessories", "Services & Fees", "Other Equipment"];

  function category(name) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i][1].test(name)) return CATS[i][0];
    return "Other Equipment";
  }

  // status for one item given its alert minimum (null = not watched)
  function status(item, min) {
    var watched = min != null && min !== "" && !isNaN(min);
    if (watched) {
      if (item.available === 0) return { key: "out", label: "Out of stock", alert: true };
      if (item.available < Number(min)) return { key: "low", label: "Low stock", alert: true };
      return { key: "ok", label: "Healthy", alert: false };
    }
    if (item.available === 0) return { key: "out", label: "Out of stock", alert: false };
    return { key: "idle", label: "In stock", alert: false };
  }

  function money(n) {
    return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function summarize(items, mins) {
    var s = { products: items.length, units: 0, available: 0, assigned: 0, value: 0, availValue: 0, low: 0, out: 0, watched: 0, alerts: [] };
    items.forEach(function (it) {
      s.units += it.total; s.available += it.available; s.assigned += it.assigned;
      s.value += it.total * it.cost; s.availValue += it.available * it.cost;
      var m = mins[it.name];
      var st = status(it, m);
      if (m != null) s.watched++;
      if (st.key === "low") s.low++;
      if (st.key === "out") s.out++;
      if (st.alert) s.alerts.push({ item: it, min: Number(m), status: st, need: Math.max(0, Number(m) - it.available) });
    });
    s.alerts.sort(function (a, b) { return (a.status.key === "out" ? 0 : 1) - (b.status.key === "out" ? 0 : 1) || b.need - a.need; });
    return s;
  }

  function byCategory(items) {
    var g = {};
    items.forEach(function (it) { var c = category(it.name); (g[c] = g[c] || []).push(it); });
    return CAT_ORDER.filter(function (c) { return g[c]; }).map(function (c) {
      var list = g[c].slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
      var t = { name: c, items: list, units: 0, available: 0, assigned: 0, value: 0 };
      list.forEach(function (it) { t.units += it.total; t.available += it.available; t.assigned += it.assigned; t.value += it.total * it.cost; });
      return t;
    });
  }

  /* ---------- PDF report ---------- */
  function buildReport(jsPDF, autoTable, o) {
    var items = o.items, mins = o.mins, when = o.generatedAt || new Date();
    var s = summarize(items, mins), groups = byCategory(items);
    var doc = new jsPDF({ unit: "pt", format: "letter" });
    var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40;
    var NAVY = [10, 46, 110], BLUE = [23, 100, 216], INK = [28, 35, 48], MUTED = [104, 115, 133], LINE = [225, 230, 238],
        RED = [190, 38, 38], AMBER = [181, 108, 0], GREEN = [24, 122, 72], TINT = [244, 247, 252];
    var dateStr = when.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) + "  " +
      when.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

    // Header band
    doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]); doc.rect(0, 0, W, 84, "F");
    doc.setFillColor(BLUE[0], BLUE[1], BLUE[2]); doc.rect(0, 84, W, 4, "F");
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setCharSpace(1.6);
    doc.text("DOLPHIN", M, 26); doc.setCharSpace(0);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(190, 205, 230); doc.text("Merchant Services", M + 64, 26);
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(21);
    doc.text("Inventory Report", M, 54);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(190, 205, 230);
    doc.text("Stock, value and items below minimum", M, 71);
    doc.setTextColor(255, 255, 255); doc.setFontSize(9);
    doc.text("Generated", W - M, 38, { align: "right" });
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.text(dateStr, W - M, 54, { align: "right" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(190, 205, 230);
    doc.text(o.source || "Source: Dolphin Merchants portal", W - M, 68, { align: "right" });

    // KPI tiles 3 x 2
    var tiles = [
      ["Products", String(s.products), "device types on record"],
      ["Total units", String(s.units), s.available + " available, " + s.assigned + " assigned"],
      ["Inventory value", money(s.value), "at unit cost"],
      ["Available value", money(s.availValue), "sitting on the shelf"],
      ["Low stock", String(s.low), "below your minimum", s.low ? AMBER : GREEN],
      ["Out of stock", String(s.out), "nothing available", s.out ? RED : GREEN]
    ];
    var gap = 10, tw = (W - 2 * M - 2 * gap) / 3, th = 62, y0 = 108;
    tiles.forEach(function (t, i) {
      var x = M + (i % 3) * (tw + gap), y = y0 + Math.floor(i / 3) * (th + gap);
      doc.setFillColor(TINT[0], TINT[1], TINT[2]); doc.setDrawColor(LINE[0], LINE[1], LINE[2]);
      doc.roundedRect(x, y, tw, th, 5, 5, "FD");
      var c = t[3] || BLUE; doc.setFillColor(c[0], c[1], c[2]); doc.rect(x, y + 8, 3, th - 16, "F");
      doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]); doc.setFont("helvetica", "bold"); doc.setFontSize(7.5);
      doc.text(t[0].toUpperCase(), x + 14, y + 18);
      doc.setTextColor(t[3] ? c[0] : INK[0], t[3] ? c[1] : INK[1], t[3] ? c[2] : INK[2]); doc.setFontSize(17);
      doc.text(t[1], x + 14, y + 39);
      doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]); doc.setFont("helvetica", "normal"); doc.setFontSize(8);
      doc.text(t[2], x + 14, y + 52);
    });
    var y = y0 + 2 * th + gap + 26;

    function sectionTitle(title, sub, yy) {
      doc.setTextColor(INK[0], INK[1], INK[2]); doc.setFont("helvetica", "bold"); doc.setFontSize(12.5);
      doc.text(title, M, yy);
      if (sub) { doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]); doc.text(sub, W - M, yy, { align: "right" }); }
      return yy + 8;
    }
    var base = {
      theme: "plain", margin: { left: M, right: M, top: 50, bottom: 46 },
      styles: { font: "helvetica", fontSize: 8.5, cellPadding: { top: 5, bottom: 5, left: 6, right: 6 }, textColor: INK, lineColor: LINE, lineWidth: { bottom: 0.5 } },
      headStyles: { fillColor: [235, 240, 248], textColor: [70, 82, 102], fontStyle: "bold", fontSize: 7.5 },
      alternateRowStyles: { fillColor: [250, 251, 253] }
    };
    function merge(a, b) { var r = {}, k; for (k in a) r[k] = a[k]; for (k in b) r[k] = b[k]; return r; }

    // Needs attention
    y = sectionTitle("Needs attention", s.alerts.length ? s.alerts.length + " item" + (s.alerts.length > 1 ? "s" : "") + " below minimum" : "", y);
    if (s.alerts.length) {
      autoTable(doc, merge(base, {
        startY: y,
        head: [["Item", "Category", "Status", "Available", "Minimum", "Order to reach min", "Unit cost", "Reorder cost"]],
        body: s.alerts.map(function (a) {
          return [a.item.name, category(a.item.name), a.status.label, a.item.available, a.min, a.need, money(a.item.cost), money(a.need * a.item.cost)];
        }),
        columnStyles: { 0: { cellWidth: 130, fontStyle: "bold" }, 2: { cellWidth: 66 }, 3: { halign: "right" }, 4: { halign: "right" }, 5: { halign: "right" }, 6: { halign: "right" }, 7: { halign: "right" } },
        didParseCell: function (d) {
          if (d.section === "body" && d.column.index === 2) {
            d.cell.styles.textColor = d.cell.raw === "Out of stock" ? RED : AMBER; d.cell.styles.fontStyle = "bold";
          }
          if (d.section === "head" && d.column.index >= 3) d.cell.styles.halign = "right";
        }
      }));
      var reorder = s.alerts.reduce(function (t, a) { return t + a.need * a.item.cost; }, 0);
      y = doc.lastAutoTable.finalY + 14;
      doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(INK[0], INK[1], INK[2]);
      doc.text("Estimated cost to restock to minimum: " + money(reorder), W - M, y, { align: "right" });
      y += 26;
    } else {
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(GREEN[0], GREEN[1], GREEN[2]);
      doc.text("Every item with an alert set is at or above its minimum.", M, y + 12); y += 36;
    }

    // Category summary
    if (y > H - 200) { doc.addPage(); y = 60; }
    y = sectionTitle("Stock by category", "", y);
    autoTable(doc, merge(base, {
      startY: y,
      head: [["Category", "Products", "Units", "Available", "Assigned", "Value", "Share of value"]],
      body: groups.map(function (g) { return [g.name, g.items.length, g.units, g.available, g.assigned, money(g.value), (g.value / s.value * 100).toFixed(1) + "%"]; }),
      foot: [["Total", s.products, s.units, s.available, s.assigned, money(s.value), "100%"]],
      footStyles: { fillColor: [235, 240, 248], textColor: INK, fontStyle: "bold" },
      columnStyles: { 0: { fontStyle: "bold" }, 1: { halign: "right" }, 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" }, 5: { halign: "right" }, 6: { halign: "right" } },
      didParseCell: function (d) { if ((d.section === "head" || d.section === "foot") && d.column.index >= 1) d.cell.styles.halign = "right"; }
    }));

    // Full inventory
    doc.addPage(); y = 60;
    y = sectionTitle("Full inventory", s.products + " products  |  " + s.units + " units", y);
    var body = [];
    groups.forEach(function (g) {
      body.push([{ content: g.name + "   (" + g.items.length + " products, " + money(g.value) + ")", colSpan: 8, styles: { fillColor: [222, 232, 248], textColor: NAVY, fontStyle: "bold", fontSize: 8.5 } }]);
      g.items.forEach(function (it) {
        var m = mins[it.name], st = status(it, m);
        body.push([it.name, it.total, it.available, it.assigned, m != null ? m : "-", st.label, money(it.cost), money(it.total * it.cost)]);
      });
    });
    autoTable(doc, merge(base, {
      startY: y,
      head: [["Item", "Total", "Available", "Assigned", "Min", "Status", "Unit cost", "Value"]],
      body: body,
      columnStyles: { 0: { cellWidth: 178 }, 1: { halign: "right" }, 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" }, 6: { halign: "right" }, 7: { halign: "right" } },
      didParseCell: function (d) {
        if (d.section === "head" && [1, 2, 3, 4, 6, 7].indexOf(d.column.index) >= 0) d.cell.styles.halign = "right";
        if (d.section === "body" && d.column.index === 5) {
          var v = d.cell.raw;
          d.cell.styles.textColor = v === "Out of stock" ? RED : v === "Low stock" ? AMBER : v === "Healthy" ? GREEN : MUTED;
          if (v === "Out of stock" || v === "Low stock") d.cell.styles.fontStyle = "bold";
        }
      }
    }));

    // Footer + running header on every page
    var n = doc.internal.getNumberOfPages();
    for (var p = 1; p <= n; p++) {
      doc.setPage(p);
      if (p > 1) {
        doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
        doc.text("Inventory Report", M, 30);
        doc.setFont("helvetica", "normal"); doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
        doc.text(dateStr, W - M, 30, { align: "right" });
        doc.setDrawColor(LINE[0], LINE[1], LINE[2]); doc.setLineWidth(0.6); doc.line(M, 37, W - M, 37);
      }
      doc.setDrawColor(LINE[0], LINE[1], LINE[2]); doc.setLineWidth(0.6); doc.line(M, H - 34, W - M, H - 34);
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
      doc.text("Dolphin Merchant Services  |  Internal use", M, H - 20);
      doc.text("Page " + p + " of " + n, W - M, H - 20, { align: "right" });
    }
    return doc;
  }


  /* ---------- Restock PDF: the items we need to order ---------- */
  function buildRestock(jsPDF, autoTable, o) {
    var items = o.items, mins = o.mins, when = o.generatedAt || new Date();
    var s = summarize(items, mins);
    var doc = new jsPDF({ unit: "pt", format: "letter" });
    var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40;
    var NAVY = [10, 46, 110], BLUE = [23, 100, 216], INK = [28, 35, 48], MUTED = [104, 115, 133], LINE = [225, 230, 238],
        RED = [190, 38, 38], AMBER = [181, 108, 0], GREEN = [24, 122, 72], TINT = [244, 247, 252];
    function fill(c) { doc.setFillColor(c[0], c[1], c[2]); } function ink(c) { doc.setTextColor(c[0], c[1], c[2]); } function draw(c) { doc.setDrawColor(c[0], c[1], c[2]); }
    var dateStr = when.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    var timeStr = when.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

    // Header
    fill(NAVY); doc.rect(0, 0, W, 84, "F"); fill(BLUE); doc.rect(0, 84, W, 4, "F");
    ink([255, 255, 255]); doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setCharSpace(1.6);
    doc.text("DOLPHIN", M, 26); doc.setCharSpace(0);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(190, 205, 230); doc.text("Merchant Services", M + 64, 26);
    ink([255, 255, 255]); doc.setFont("helvetica", "bold"); doc.setFontSize(21); doc.text("Restock List", M, 54);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(190, 205, 230);
    doc.text("Items we need to order", M, 71);
    ink([255, 255, 255]); doc.setFontSize(9); doc.text("Prepared", W - M, 38, { align: "right" });
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.text(dateStr + "  " + timeStr, W - M, 54, { align: "right" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(190, 205, 230);
    doc.text("Order qty brings each item back to its minimum", W - M, 68, { align: "right" });

    var alerts = s.alerts;
    var units = alerts.reduce(function (t, a) { return t + a.need; }, 0);
    var cost = alerts.reduce(function (t, a) { return t + a.need * a.item.cost; }, 0);
    var outN = alerts.filter(function (a) { return a.status.key === "out"; }).length;

    // Tiles
    var tiles = [
      ["Items to order", String(alerts.length), outN + " out of stock, " + (alerts.length - outN) + " low", alerts.length ? AMBER : GREEN],
      ["Units to order", String(units), "to reach your minimums", BLUE],
      ["Estimated cost", money(cost), "at current unit cost", NAVY]
    ];
    var gap = 10, tw = (W - 2 * M - 2 * gap) / 3, th = 62, y = 108;
    tiles.forEach(function (t, i) {
      var x = M + i * (tw + gap), c = t[3];
      fill(TINT); draw(LINE); doc.roundedRect(x, y, tw, th, 5, 5, "FD");
      fill(c); doc.rect(x, y + 8, 3, th - 16, "F");
      ink(MUTED); doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.text(t[0].toUpperCase(), x + 14, y + 18);
      ink(i === 0 ? c : INK); doc.setFontSize(18); doc.text(t[1], x + 14, y + 40);
      ink(MUTED); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.text(t[2], x + 14, y + 53);
    });
    y += th + 28;

    var base = {
      theme: "plain", margin: { left: M, right: M, top: 50, bottom: 50 }, showHead: "everyPage",
      styles: { font: "helvetica", fontSize: 9, cellPadding: { top: 6, bottom: 6, left: 6, right: 6 }, textColor: INK, lineColor: LINE, lineWidth: { bottom: 0.5 }, valign: "middle" },

<script>
(function () {
"use strict";
/* ================= data + store ================= */
var SEED = window.__SEED; var DEMO = !!window.__DEMO; var LKEY = DEMO ? "dinv.demo.v1" : "dinv.store.v2"; // {items:[{name,total,available,assigned,cost}], units:[{product,serial,po,to,status,by,date}], taken}

function slugify(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "item"; }

function fmtDate(s) { if (!s) return "date not recorded"; var d = new Date(s.length <= 10 ? s + "T12:00:00" : s); if (isNaN(d)) return s; return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); }

var S = { products: {}, pos: {}, settings: { defMin: 5, hideSvc: false } , ready: false, mode: "local" };
var me = local("dinv.me") || "";
var ME = { uid: null }, NAMES = {}, USER = null, STAMP = { by: me };
function who(h) { return h && h.uid ? (NAMES[h.uid] || "Someone") : ((h && h.by) || ""); }
function ev(o) { o.ts = Date.now(); if (ME.uid) o.uid = ME.uid; else o.by = STAMP.by || me || ""; return o; }

function buildFromSeed() {
  var products = {}, pos = {}, bySlug = {};
  var starter = window.__STARTER_MINS || {};
  SEED.items.forEach(function (it) {
    var slug = slugify(it.name); while (bySlug[slug]) slug += "-2"; bySlug[slug] = 1;
    products[slug] = { slug: slug, name: it.name, cost: it.cost, min: starter[it.name] != null ? starter[it.name] : null, units: [] };
  });
  var nameToSlug = {}; Object.keys(products).forEach(function (k) { nameToSlug[products[k].name] = k; });
  SEED.units.forEach(function (u, i) {
    var slug = nameToSlug[u.product]; if (!slug) return;
    var h = [{ t: "received", at: "", by: "", po: u.po, note: u.po ? "" : "Imported without a PO" }];
    if (u.status === "assigned") h.push({ t: "assigned", at: u.date, by: u.by, to: u.to });
    products[slug].units.push({ id: "s" + i, serial: u.serial, po: u.po, status: u.status, to: u.status === "assigned" ? u.to : "", since: u.status === "assigned" ? u.date : "", history: h });
    if (u.po) {
      var p = pos[u.po] || (pos[u.po] = { num: u.po, vendor: "", date: "", createdBy: "", imported: true, lines: [] });
      var line = p.lines.filter(function (l) { return l.slug === slug; })[0];
      if (!line) p.lines.push(line = { slug: slug, name: products[slug].name, ordered: 0, cost: products[slug].cost });
      line.ordered++;
    }
  });
  return { products: products, pos: pos };
}

/* local mode: keep whole store in this browser */
function loadLocal() {
  var st = local(LKEY);
  if (st && st.products) { S.products = st.products; S.pos = st.pos; S.settings = st.settings || S.settings; }
  else { var b = buildFromSeed(); S.products = b.products; S.pos = b.pos; }
}
function saveLocal() { local(LKEY, { products: S.products, pos: S.pos, settings: S.settings }); }

/* shared db mode */
var db = null, writeQ = {};
function queueWrite(path, data) {
  if (!db || S.mode !== "db") { saveLocal(); return Promise.resolve(); }
  var prev = writeQ[path] || Promise.resolve();
  var p = prev.then(function () { return db.doc(path).set(JSON.parse(JSON.stringify(data))); }).catch(function (e) { toast("Couldn't save. " + (e && e.code === "invalid_argument" ? "You may have view-only access." : "Check your connection.")); });
  writeQ[path] = p; return p;
}
function saveProduct(slug) { return queueWrite("products/" + slug, S.products[slug]); }
function savePO(num) { return queueWrite("pos/" + num, S.pos[num]); }
function saveSettings() { return queueWrite("settings/app", S.settings); }

loadLocal();

/* ================= derived helpers ================= */
function plist() { return Object.keys(S.products).map(function (k) { return S.products[k]; }); }
function counts(p) { var a = 0, s = 0; p.units.forEach(function (u) { if (u.status === "assigned") s++; else a++; }); return { total: p.units.length, available: a, assigned: s }; }
function asItems() { return plist().map(function (p) { var c = counts(p); return { name: p.name, total: c.total, available: c.available, assigned: c.assigned, cost: p.cost }; }); }
function mins() { var m = {}; plist().forEach(function (p) { if (p.min != null) m[p.name] = p.min; }); return m; }
function allUnits() { var r = []; plist().forEach(function (p) { p.units.forEach(function (u) { r.push({ p: p, u: u }); }); }); return r; }
function poUnits(num) { return allUnits().filter(function (x) { return x.u.po === num; }); }
function poStatus(po) {
  var rec = 0, ord = 0; po.lines.forEach(function (l) { ord += l.ordered; });
  var units = poUnits(po.num); rec = units.length;
  var key = rec === 0 ? "open" : rec < ord ? "partial" : "received";
  return { ordered: ord, received: rec, key: key, label: key === "open" ? "Waiting" : key === "partial" ? "Partially received" : "Received", assigned: units.filter(function (x) { return x.u.status === "assigned"; }).length };
}
function lineReceived(po, slug) { var p = S.products[slug]; return p ? p.units.filter(function (u) { return u.po === po.num; }).length : 0; }
function findUnit(id) { var ps = plist(); for (var i = 0; i < ps.length; i++) for (var j = 0; j < ps[i].units.length; j++) if (ps[i].units[j].id === id) return { p: ps[i], u: ps[i].units[j] }; return null; }
function merchants() {
  var m = {}; allUnits().forEach(function (x) { if (x.u.status !== "assigned") return; var k = x.u.to || "(no name)"; (m[k] = m[k] || []).push(x); });
  return Object.keys(m).map(function (k) { var list = m[k]; var last = list.reduce(function (a, x) { return x.u.since > a ? x.u.since : a; }, ""); return { name: k, slug: slugify(k), units: list, value: list.reduce(function (t, x) { return t + x.p.cost; }, 0), last: last }; })
    .sort(function (a, b) { return b.units.length - a.units.length || a.name.localeCompare(b.name); });
}
function serialIndex() { var m = {}; allUnits().forEach(function (x) { var k = x.u.serial.trim().toLowerCase(); (m[k] = m[k] || []).push(x); }); return m; }
function dataChecks() {
  var idx = serialIndex(), dup = 0, dupKeys = [];
  Object.keys(idx).forEach(function (k) { if (idx[k].length > 1) { dup += idx[k].length; dupKeys.push(k); } });
  var all = allUnits();
  return { dupUnits: dup, dupKeys: dupKeys, noPO: all.filter(function (x) { return !x.u.po; }).length, dummy: all.filter(function (x) { return /dummy/i.test(x.u.serial); }).length };
}
function activity(limit) {
  var r = [];
  allUnits().forEach(function (x) { x.u.history.forEach(function (h) { if (h.at) r.push({ p: x.p, u: x.u, h: h }); }); });
  Object.keys(S.pos).forEach(function (k) { (S.pos[k].history || []).forEach(function (h) { r.push({ po: S.pos[k], h: h }); }); });
  plist().forEach(function (p) { (p.history || []).forEach(function (h) { r.push({ p: p, h: h, item: true }); }); });
  r.sort(function (a, b) { return a.h.at < b.h.at ? 1 : a.h.at > b.h.at ? -1 : (b.h.ts || 0) - (a.h.ts || 0); });
  return limit ? r.slice(0, limit) : r;
}

/* ================= routing ================= */
var view = { name: "inventory", arg: "" }, ui = { q: "", filter: "all", cat: "", sort: { k: "status", d: 1 }, unitFilter: "all", mq: "", aq: "", poq: "" };
function parseHash() {
  var h = (location.hash || "").replace(/^#/, "");
  if (!h || h === "inventory") return { name: "inventory" };
  if (h === "orders") return { name: "orders" };
  if (h === "merchants") return { name: "merchants" };
  if (h === "activity") return { name: "activity" };
  if (h.indexOf("po-") === 0) return { name: "po", arg: h.slice(3) };
  if (h.indexOf("item-") === 0) return { name: "item", arg: h.slice(5) };
  if (h.indexOf("at-") === 0) return { name: "merchant", arg: h.slice(3) };
  return { name: "inventory" };
}
function go(h) { if (location.hash === "#" + h) { route(); } else location.hash = h; }
function route() { view = parseHash(); render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);

/* ================= render ================= */
function render() {
  var tabs = [["inventory", "Inventory"], ["orders", "Purchase orders"], ["merchants", "Assigned to"], ["activity", "Activity"]];
  var active = { inventory: "inventory", item: "inventory", orders: "orders", po: "orders", merchants: "merchants", merchant: "merchants", activity: "activity" }[view.name];
  $("nav").innerHTML = tabs.map(function (t) { return '<a href="#' + t[0] + '" class="tab' + (active === t[0] ? " on" : "") + '"' + (active === t[0] ? ' aria-current="page"' : "") + '>' + t[1] + '</a>'; }).join("");

  var bd = $("badge"); bd.hidden = !s.alerts.length; bd.textContent = s.alerts.length;
  renderDrawerAlerts(s);
  var v = $("view");
  if (view.name === "inventory") v.innerHTML = vInventory(s);
  else if (view.name === "item") v.innerHTML = vItem(S.products[view.arg]);
  else if (view.name === "orders") v.innerHTML = vOrders();
  else if (view.name === "po") v.innerHTML = vPO(S.pos[view.arg]);
  else if (view.name === "merchants") v.innerHTML = vMerchants();
  else if (view.name === "merchant") v.innerHTML = vMerchant(view.arg);
  else if (view.name === "activity") v.innerHTML = vActivity();
  if (view.name === "inventory") renderProdTable();
  if (openUnitId) renderUnit();
}

/* ---------- Inventory ---------- */
function tile(k, v, s, cls, f) { return '<div class="tile ' + (cls || "") + (f ? " click" : "") + '"' + (f ? ' data-act="filter" data-f="' + f + '" role="button" tabindex="0"' : "") + '><div class="k">' + k + '</div><div class="v num">' + v + '</div><div class="s">' + s + '</div></div>'; }
function vInventory(s) {
  var att = s.alerts.length ? s.alerts.map(function (a) {
    var out = a.status.key === "out", p = S.products[slugify(a.item.name)] || plist().filter(function (x) { return x.name === a.item.name; })[0];
    return '<a class="aitem" href="#item-' + p.slug + '"><div><div class="nm">' + esc(a.item.name) + '</div><div class="cat">' + a.item.available + ' available, minimum ' + a.min + '</div></div>' +
      '<div class="bar"><i style="width:' + Math.min(100, a.item.available / a.min * 100) + '%;background:var(--' + (out ? "red" : "amber") + ')"></i></div>' +

      tile("Inventory value", M(s.value), M(s.availValue) + " available") +

        (s.alerts.length ? '<button class="btn sm primary" type="button" data-act="restock-pdf" style="margin-left:12px">Restock PDF</button>' : "") + '</div><div class="alist">' + att + '</div></section>' +
    '<section class="panel" style="margin-top:16px"><div class="ph"><h2>All items</h2><span class="sub">Click an item to see every unit, its PO and who has it.</span></div>' +

      '<div class="tblwrap"><table class="grid"><thead><tr>' +
        th("name", "Item") + th("status", "Status") + th("available", "Available / Total", "r") + th("assigned", "Assigned", "r") + '<th>Alert below</th>' + th("cost", "Unit cost", "r") + th("value", "Value", "r") +

  }
});

    var out = a.status.key === "out", p = plist().filter(function (x) { return x.name === a.item.name; })[0];
    return '<a class="note" href="#item-' + (p ? p.slug : "") + '" data-act="close-drawer"><span class="dot" style="background:var(--' + (out ? "red" : "amber") + ')"></span><div><div class="t">' + esc(a.item.name) + (out ? " is out of stock" : " is running low") + '</div><div class="mut">' + a.item.available + ' available, your minimum is ' + a.min + '. Order ' + a.need + ' (about ' + M(a.need * a.item.cost) + ').</div></div></a>';
  }).join("") : '<div class="empty">No low stock right now.</div>';
}
$("bBell").onclick = function () { openDrawer(true); };
$("dClose").onclick = function () { openDrawer(false); };
$("dBody").addEventListener("click", function () { openDrawer(false); });
$("uClose").onclick = closeUnit;
$("scrim").onclick = function () { closeModal(); closeUnit(); openDrawer(false); };
$("search").addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return; var v = this.value.trim().toLowerCase(); if (!v) return;
  var hit = allUnits().filter(function (x) { return x.u.serial.toLowerCase() === v; })[0] || allUnits().filter(function (x) { return x.u.serial.toLowerCase().indexOf(v) >= 0; })[0];
  if (hit) { openUnit(hit.u.id); this.value = ""; return; }
  if (S.pos[v.toUpperCase()]) { go("po-" + v.toUpperCase()); this.value = ""; return; }
  var m = merchants().filter(function (x) { return x.name.toLowerCase().indexOf(v) >= 0; })[0]; if (m) { go("at-" + m.slug); this.value = ""; return; }
  toast("No serial, PO or merchant matches \"" + this.value + "\"");
});
function savePdf(doc, name) {
  var blob = new Blob([doc.output("arraybuffer")], { type: "application/pdf" });
  var fallback = function () { var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.target = "_blank"; a.rel = "noopener"; a.click(); toast("PDF opened in a new tab"); };
  if (window.claude && window.claude.use) window.claude.use("downloads").then(function (dl) {
    if (!dl) return fallback();
    return dl.save({ filename: name, data: blob }).then(function () { toast("Saved: " + name); }, function (e) { if (e && e.code === "declined") toast("Download cancelled"); else fallback(); });
  }).catch(fallback); else fallback();
}
function pdfReady() { if (!window.jspdf || !window.jspdf.jsPDF) { toast("The PDF tool didn't load. Check your connection and reload."); return false; } return true; }
var AT = function (d, o) { return d.autoTable(o); };
$("bPdf").onclick = function () {
  if (!pdfReady()) return;
  savePdf(INV.buildReport(window.jspdf.jsPDF, AT, { items: asItems(), mins: mins(), generatedAt: new Date(), source: "Source: Dolphin Inventory" }), "Inventory-Report-" + today() + ".pdf");
};
function restockPdf() {
  if (!pdfReady()) return;
  savePdf(INV.buildRestock(window.jspdf.jsPDF, AT, { items: asItems(), mins: mins(), generatedAt: new Date() }), "Restock-List-" + today() + ".pdf");
}
$("bRestock").onclick = restockPdf;

var tt; function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("on"); }, 3200); }

/* ================= shared database ================= */
function setSync(text, ok) { $("sync").textContent = text; $("syncdot").className = "syncdot" + (ok ? " ok" : ""); }
setSync("Saved in this browser", false);
if (!DEMO && window.claude && window.claude.use) {
  window.claude.use("db").then(function (d) {
    if (!d) return;
    db = d; setSync("Connecting…", false);
    var got = { p: false, o: false }, gotP = null, gotO = null, timer = setTimeout(function () { setSync("Can't reach the shared data yet", false); }, 10000);
    function both() {
      if (!got.p || !got.o) return;
      clearTimeout(timer);
      if (!gotP.length) { S.mode = "empty"; showSetup(); return; }
      var prods = {}; gotP.forEach(function (x) { prods[x.slug] = x; }); var pos = {}; gotO.forEach(function (x) { pos[x.num] = x; });
      S.products = prods; S.pos = pos; S.mode = "db"; hideSetup(); setSync("Shared · saved for everyone on this page", true); render();
    }
    d.collection("products").limit(1000).onSnapshot(function (snap) { if (snap.metadata.fromCache && !snap.size) return; gotP = snap.docs.map(function (x) { return x.data(); }); got.p = true; both(); }, function () { setSync("Shared data unavailable", false); });
    d.collection("pos").limit(1000).onSnapshot(function (snap) { if (snap.metadata.fromCache && !snap.size) return; gotO = snap.docs.map(function (x) { return x.data(); }); got.o = true; both(); }, function () {});
    d.doc("settings/app").onSnapshot(function (s) { if (s.exists) { S.settings = Object.assign({ defMin: 5, hideSvc: false }, s.data()); } }, function () {});
  }).catch(function () {});
}
function showSetup() {
  var b = buildFromSeed(), nU = 0; Object.keys(b.products).forEach(function (k) { nU += b.products[k].units.length; });
  $("setup").hidden = false;
  $("setup").innerHTML = '<div><b>Start the shared inventory.</b> Load the portal snapshot from ' + fmtDate(SEED.taken.slice(0, 10)) + ': ' + Object.keys(b.products).length + ' items, ' + nU + ' units and ' + Object.keys(b.pos).length + ' purchase orders. After that, everything you change here is saved for everyone who opens this page.</div><button class="btn primary" type="button" id="bSeed">Load snapshot</button><div class="prog" id="prog" hidden><i></i></div>';
  $("bSeed").onclick = function () { seedDb(b); };
  setSync("Not set up yet", false);
}
function hideSetup() { $("setup").hidden = true; }
function seedDb(b) {
  var btn = $("bSeed"); btn.disabled = true; btn.textContent = "Loading…"; $("prog").hidden = false;
  var jobs = [];
  Object.keys(b.products).forEach(function (k) { jobs.push(["products/" + k, b.products[k]]); });
  Object.keys(b.pos).forEach(function (k) { jobs.push(["pos/" + k, b.pos[k]]); });
  jobs.push(["settings/app", S.settings]);
  var i = 0, fails = 0;
  (function next() {
    if (i >= jobs.length) { toast(fails ? fails + " records didn't save. Reload and try again." : "Shared inventory is ready"); return; }
    var j = jobs[i++];
    db.doc(j[0]).set(JSON.parse(JSON.stringify(j[1]))).catch(function (e) { if (e && e.code === "resource_exhausted") { i--; return new Promise(function (r) { setTimeout(r, 1500); }); } fails++; })
      .then(function () { $("prog").firstChild.style.width = (i / jobs.length * 100) + "%"; setTimeout(next, 60); });
  })();
}

function resolveNames() {
  if (!USER) return;
  var ids = {}; function add(h) { if (h.uid && !NAMES[h.uid]) ids[h.uid] = 1; }
  allUnits().forEach(function (x) { x.u.history.forEach(add); });
  Object.keys(S.pos).forEach(function (k) { (S.pos[k].history || []).forEach(add); });
  plist().forEach(function (p) { (p.history || []).forEach(add); });
  var list = Object.keys(ids); if (!list.length) return;
  USER.profiles(list).then(function (ps) { var changed = false; list.forEach(function (id) { if (ps[id] && ps[id].name) { NAMES[id] = ps[id].name; changed = true; } else NAMES[id] = NAMES[id] || "Someone"; }); if (changed) render(); });
}
var _render = render; render = function () { _render(); renderMe(); setTimeout(resolveNames, 0); };
function renderMe() { var el = $("meChip"); if (!el) return; return; el.textContent = ME.uid ? (NAMES[ME.uid] || "You") : (me ? me + " (not verified)" : "Set your name"); el.title = ME.uid ? "Signed in with your Claude account. Every change you make is recorded under this name." : "Not signed in here. Changes use the name you type."; }
if ($("meChip")) $("meChip").onclick = function () { if (ME.uid) { toast("Recorded as " + (NAMES[ME.uid] || "you") + " from your Claude account."); return; } modal("Your name", field("fBy", "Name to record on your changes", '<input id="fBy" required value="' + esc(me) + '">'), "Save", function () { rememberMe(); renderMe(); }); };
if (window.claude && window.claude.use) window.claude.use("user").then(function (u) {
  if (!u) return; USER = u;
  u.me().then(function (m) { if (m && m.id) { ME.uid = m.id; ME.color = m.color; if (m.name) NAMES[m.id] = m.name; STAMP = { uid: m.id }; render(); } });
});
function demoPanel() {
  if (!DEMO) return;
  var evs = activity(0).filter(function (x) { return x.h.ts; }), has = function (t) { return evs.some(function (x) { return x.h.t === t; }); };
  var steps = [["po-created", "Create a purchase order", "#orders", "Purchase orders → New purchase order"], ["po-received", "Receive it with serial numbers", "#orders", "Open your PO → Receive items"], ["assigned", "Assign a unit to a merchant", "#inventory", "Click any item → Assign"], ["reassigned", "Reassign it to someone else", "#merchants", "Open the unit → Reassign"], ["released", "Release it back to stock", "#merchants", "Open the unit → Release to stock"], ["min", "Set a low-stock alert", "#inventory", "Type a number in Alert below"]];
  var done = steps.filter(function (x) { return has(x[0]); }).length;
  var el = $("setup"); el.hidden = false; el.className = "setup demo";
  el.innerHTML = '<div><b>Demo inventory.</b> Try the whole flow. Everything you do stays in your browser, so nobody else sees it and you can\'t break anything. <span class="mut">' + done + ' of ' + steps.length + ' done</span>' +
    '<ol class="dsteps">' + steps.map(function (x) { var ok = has(x[0]); return '<li class="' + (ok ? "ok" : "") + '"><a href="' + x[2] + '">' + x[1] + '</a><small>' + x[3] + '</small></li>'; }).join("") + '</ol></div>' +
    '<button class="btn" type="button" id="bReset">Reset demo</button>';
  $("bReset").onclick = function () { if (this.dataset.arm !== "1") { this.dataset.arm = "1"; this.textContent = "Click again to reset"; return; } try { localStorage.removeItem(LKEY); } catch (e) {} var b = buildFromSeed(); S.products = b.products; S.pos = b.pos; go("inventory"); render(); toast("Demo reset to the starting data"); };
}

route();
})();

</script>
